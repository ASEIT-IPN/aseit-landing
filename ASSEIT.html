<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ASEIT IPN</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Segoe+UI:wght@400;700&display=swap');
    body {
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', sans-serif;
      background: linear-gradient(135deg, #a0c4cc, #003249);
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
    }
    .container {
      background: transparent;
      border-radius: 20px;
      padding: 2rem 1rem;
      text-align: center;
      width: 90%;
      max-width: 400px;
    }
    .logo {
      width: 120px;
      height: 120px;
      border-radius: 50%;
      margin: 0 auto 1rem;
      display: block;
    }
    .description {
      font-size: 1rem;
      color: white;
      margin-bottom: 2rem;
    }
    .btn {
      display: block;
      width: 100%;
      background-color: #0A3A53;
      color: white;
      text-decoration: none;
      font-weight: bold;
      padding: 0.75rem;
      border-radius: 30px;
      margin: 0.5rem 0;
      transition: background 0.3s, transform 0.3s;
      border: none;
    }
    .btn:hover {
      background-color: #125670;
      transform: scale(1.05);
    }
    .social-icons {
      margin-top: 2rem;
    }
    .social-icons a {
      margin: 0 10px;
      color: white;
      text-decoration: none;
      font-size: 1.5rem;
    }
  </style>
  <script src="https://kit.fontawesome.com/a2e0e6adcf.js" crossorigin="anonymous"></script>
</head>
<body>
  <div class="container">
    <img src="portadacorreos.png" alt="Logo ASEIT" class="logo">
    <div class="description">Asociación de Estudiantes de Ingeniería en Transporte - IPN UPIICSA</div>
    <a href="https://www.instagram.com/aseit_ipn/" class="btn" target="_blank">Instagram</a>
    <a href="https://www.facebook.com/aseit.ipn" class="btn" target="_blank">Facebook</a>
    <a href="https://www.linkedin.com/company/aseit-ipn/" class="btn" target="_blank">LinkedIn</a>
    <a href="https://x.com/ASEITOficial" class="btn" target="_blank">X (Twitter)</a>
    <div class="social-icons">
      <a href="https://www.instagram.com/aseit_ipn/" target="_blank"><i class="fab fa-instagram"></i></a>
      <a href="https://www.facebook.com/aseit.ipn" target="_blank"><i class="fab fa-facebook-f"></i></a>
      <a href="https://x.com/ASEITOficial" target="_blank"><i class="fab fa-x-twitter"></i></a>
      <a href="https://www.linkedin.com/company/aseit-ipn/" target="_blank"><i class="fab fa-linkedin-in"></i></a>
    </div>
  </div>
</body>
</html>
